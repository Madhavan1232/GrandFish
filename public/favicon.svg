<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="gfBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2a2824"/>
      <stop offset="100%" stop-color="#181715"/>
    </linearGradient>
    <linearGradient id="pawnGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8ec554"/>
      <stop offset="100%" stop-color="#6e9c3b"/>
    </linearGradient>
    <filter id="pawnGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.5" stdDeviation="1.2" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>
  <!-- Background squircle tile -->
  <rect width="64" height="64" rx="14" fill="url(#gfBg)"/>
  <rect width="60" height="60" x="2" y="2" rx="12" fill="none" stroke="#81b64c" stroke-width="2" stroke-opacity="0.45"/>
  
  <!-- Chess Pawn -->
  <g filter="url(#pawnGlow)">
    <!-- Head -->
    <circle cx="32" cy="18.5" r="7.5" fill="url(#pawnGrad)"/>
    <!-- Head highlight -->
    <ellipse cx="30" cy="16" rx="2.5" ry="1.5" fill="#ffffff" fill-opacity="0.25"/>
    <!-- Collar ring -->
    <ellipse cx="32" cy="26" rx="8.5" ry="2.2" fill="url(#pawnGrad)"/>
    <!-- Body -->
    <path d="M25 27.5 C 27 34, 23.5 42, 19 45.5 L 45 45.5 C 40.5 42, 37 34, 39 27.5 Z" fill="url(#pawnGrad)"/>
    <!-- Pedestal Step 1 -->
    <rect x="17" y="45.5" width="30" height="4" rx="1.8" fill="url(#pawnGrad)"/>
    <!-- Pedestal Base 2 -->
    <rect x="14.5" y="49.5" width="35" height="4.5" rx="2" fill="url(#pawnGrad)"/>
  </g>
</svg>
